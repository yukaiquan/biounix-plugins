[package]
name = "biounix-io"
version = "0.1.0"
edition = "2021"
description = "BioUnix 文件 I/O 模块（FASTA/FASTQ/BAM/VCF/BCF/GFF/BED 解析统计，Rust + napi-rs）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
noodles = { version = "0.112", features = [
    "fasta",
    "fastq",
    "bgzf",
    "bam",
    "sam",
    "bcf",
    "vcf",
    "gff",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
