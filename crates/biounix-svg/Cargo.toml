[package]
name = "biounix-svg"
version = "0.1.0"
edition = "2021"
description = "BioUnix SVG → 光栅图像转换模块（Rust + napi-rs）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
# SVG → 栅格图像转换引擎
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
    "bmp",
] }
flate2 = "1"
# 混合流式 SVG 渲染器（超大 SVG）
quick-xml = "0.36"
ab_glyph = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
