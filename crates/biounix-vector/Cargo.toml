[package]
name = "biounix-vector"
version = "0.1.0"
edition = "2021"
description = "BioUnix 向量数据库模块（LanceDB + arrow-rs，IVF-PQ/HNSW ANN 检索，Rust + napi-rs）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
lancedb = "0.15"
arrow = "53"
arrow-array = "53"
arrow-schema = "53"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt"] }
lazy_static = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
